#Kotlin
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx8192M

# Build JS targets using npm package manager https://kotlinlang.org/docs/js-project-setup.html#npm-dependencies
kotlin.js.yarn=false

#Gradle
org.gradle.jvmargs=-Xmx4096M -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

org.jetbrains.dokka.experimental.gradle.pluginMode=V2Enabled
org.jetbrains.dokka.experimental.gradle.pluginMode.noWarn=true

kotlin.native.ignoreDisabledTargets=true

# Koog target flags — set to false to skip the entire target (stub source sets are created so references still resolve)
koog.target.android=false
koog.target.js=false
koog.target.ios=false

android.useAndroidX=true

group=ai.koog
# our version follows the semver specification
version=1.0.0.fix
